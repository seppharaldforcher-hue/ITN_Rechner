<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ITN Rechner</title>

<link rel="manifest" href="manifest.json">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#030b16;
    color:white;
    font-family:Arial,sans-serif;
}

.logo-row{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:30px;
    padding-top:20px;
    padding-bottom:10px;
}

.club-logo{
    width:120px;
    height:120px;
    object-fit:contain;
}

.title{
    text-align:center;
    margin-bottom:25px;
}

.title h1{
    margin:0;
    font-size:48px;
    font-weight:bold;
}

.title h2{
    margin-top:10px;
    color:#ffe600;
    font-size:22px;
}
.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.card{
    background:#091425;
    border:1px solid #22324a;
    border-radius:25px;
    padding:25px;
}

.inputs{
    display:flex;
    gap:20px;
}

.inputs div{
    flex:1;
}

label{
    display:block;
    margin-bottom:10px;
    font-size:22px;
    font-weight:bold;
}

input{
    width:100%;
    background:#07111f;
    border:2px solid #ffe600;
    color:white;
    border-radius:14px;
    padding:18px;
    font-size:28px;
}

button{
    width:100%;
    margin-top:25px;
    background:#ffe600;
    color:black;
    border:none;
    border-radius:16px;
    padding:18px;
    font-size:28px;
    font-weight:bold;
    cursor:pointer;
}

.section-title{
    margin-top:35px;
    margin-bottom:20px;
    font-size:38px;
    font-weight:bold;
}

.result-card{
    padding:25px;
    border-radius:25px;
    margin-bottom:20px;
}

.win{
    background:#08271a;
    border:1px solid #0bb85d;
}

.loss{
    background:#2b0911;
    border:1px solid #ff3a3a;
}

.result-card h3{
    font-size:34px;
    margin-bottom:15px;
}

.big-number{
    font-size:54px;
    font-weight:bold;
}

.change{
    margin-top:10px;
    font-size:24px;
}

.info{
    background:#07192f;
    border:1px solid #2b6fff;
    border-radius:25px;
    padding:25px;
    margin-top:20px;
}

.info h3{
    margin-bottom:10px;
}

.footer{
    text-align:center;
    margin-top:25px;
    opacity:0.8;
    font-size:14px;
}

@media(max-width:700px){

    .inputs{
        flex-direction:column;
    }

    .club-logo{
        width:90px;
        height:90px;
    }

    .title h1{
        font-size:36px;
    }

    .title h2{
        font-size:18px;
    }

    .big-number{
        font-size:42px;
    }

    input{
        font-size:22px;
    }

    button{
        font-size:22px;
    }
}

</style>
</head>

<body>

<div class="logo-row">
    <img src="icon-512.png" class="club-logo" alt="TC Kapellen">
    <img src="icon-192.png" class="club-logo" alt="TC Steinhaus">
</div>

<div class="title">
    <h1>ITN Rechner</h1>
    <h2>TC Steinhaus / TC Kapellen</h2>
</div>
<div class="container">

    <div class="card">

        <div class="inputs">

            <div>
                <label>Meine ITN</label>
                <input id="myITN" placeholder="z.B. 5,47">
            </div>

            <div>
                <label>Gegner ITN</label>
                <input id="oppITN" placeholder="z.B. 4,94">
            </div>

        </div>

        <button onclick="calculate()">
            BERECHNEN
        </button>

    </div>

    <div class="section-title">
        Ergebnis
    </div>

    <div id="results"></div>

    <div class="info">
        <h3>Hinweis</h3>
        Die Berechnung erfolgt nach der offiziellen ITN-Formel des ÖTV
        (International Tennis Number).
    </div>

    <div class="footer">
        TC Steinhaus / TC Kapellen
    </div>

</div>

<script>

function calculate(){

    const my =
        parseFloat(
            document.getElementById('myITN').value.replace(',','.')
        );

    const opp =
        parseFloat(
            document.getElementById('oppITN').value.replace(',','.')
        );

    if(isNaN(my) || isNaN(opp)){
        alert("Bitte beide ITN-Werte eingeben.");
        return;
    }

    const winFactor =
        0.25 /
        (1 + 2.595 * Math.exp(3.5 * (opp - my)));

    const lossFactor =
        0.25 /
        (1 + 2.595 * Math.exp(3.5 * (my - opp)));

    const winITN = my - winFactor;
    const lossITN = my + lossFactor;

    document.getElementById("results").innerHTML = `

        <div class="result-card win">

            <h3>🏆 ITN nach Sieg</h3>

            <div class="big-number">
                ${winITN.toFixed(3)}
            </div>

            <div class="change">
                Veränderung: ${(-winFactor).toFixed(3)}
            </div>

        </div>

        <div class="result-card loss">

            <h3>💔 ITN nach Niederlage</h3>

            <div class="big-number">
                ${lossITN.toFixed(3)}
            </div>

            <div class="change">
                Veränderung: +${lossFactor.toFixed(3)}
            </div>

        </div>
    `;
}

if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./service-worker.js');
}

</script>

</body>
</html>
